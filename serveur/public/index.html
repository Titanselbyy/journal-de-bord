<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journal de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,200;0,6..72,300;0,6..72,400;1,6..72,200;1,6..72,300&display=swap" rel="stylesheet">
<style>
  :root{
    /* Bleu nuit et cuivre, d'après la référence. Les lignes et les bordures
       prennent une pointe de cuivre plutôt que du bleu : c'est ce qui fait
       tenir ensemble le bois de l'arbre et le mobilier de la page. */
    --ink:#0d1b2c;
    --ink2:#16283f;
    --web:rgba(201,168,133,.16);
    --web2:rgba(201,168,133,.32);
    --star:#f0e8dc;
    --mute:#a6968a;
    --faint:#6f7f92;
    --rose:#c9705e;
    --cuivre:#c9885c;
    --display:"Syne","Helvetica Neue",Helvetica,sans-serif;
    --prose:"Newsreader",Georgia,"Times New Roman",serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ink);overflow-x:hidden}
  body{
    min-height:100vh;color:var(--star);font-family:var(--prose);font-weight:300;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(72% 62% at 50% 44%,#1e3552 0%,#14273f 46%,var(--ink) 100%);
  }
  button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
  :focus-visible{outline:1px solid var(--web2);outline-offset:5px}
  .shell{max-width:1200px;margin:0 auto;padding:0 18px 44px}

  /* ---------- bandeau ---------- */
  /* Le bandeau suit l'arbre : pleine largeur, calé dans les coins. Enfermé dans
     la colonne de texte, il flottait au milieu d'un écran occupé de bord à bord. */
  .masthead{display:flex;align-items:center;justify-content:space-between;gap:14px;
    width:100vw;margin-left:calc(50% - 50vw);padding:13px 26px;
    border-bottom:1px solid var(--web);background:rgba(11,23,38,.6)}
  .wordmark{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.34em;
    text-transform:uppercase;color:var(--star);text-indent:.34em}
  .yearnav{display:flex;align-items:center;gap:18px}
  .yearnav #veille{display:inline-flex;margin-left:4px}
  .yearnav button{font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.18em;
    color:var(--faint);transition:color .2s}
  .yearnav button:hover{color:var(--star)}

  /* ---------- carte ---------- */
  /* l'arbre occupe l'écran : le cadre étroit bridait la lecture */
  .plate{position:relative;width:100vw;margin-left:calc(50% - 50vw);
    height:calc(100vh - 58px);height:calc(100dvh - 58px);
    overflow:hidden;border-bottom:1px solid rgba(130,165,205,.18);
    /* L'image n'est plus posée en fond CSS : c'est le canevas qui la dessine.
       Sinon le navigateur et le code calculent chacun leur cadrage, et les
       zones sensibles glissent de quelques dizaines de pixels par rapport au
       dessin. Une seule vérité, celle du canevas. */
    background:#14243c;
    box-shadow:inset 0 0 200px rgba(4,10,20,.35)}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default}
  canvas:focus{outline:none}
  canvas:focus-visible{outline:1px solid var(--web);outline-offset:0}

  /* La veille, en colonne le long de l'arbre : les deux moitiés du projet sur
     la même page, sans clic préalable. Sous 1000 px, elle passe en bandeau bas —
     une colonne de 340 px sur un téléphone ne laisserait plus voir l'arbre. */
  #veille-dock{position:absolute;top:16px;right:16px;bottom:16px;width:340px;z-index:3;
    display:flex;pointer-events:none;border-radius:12px;overflow:hidden;
    box-shadow:0 18px 46px rgba(0,0,0,.45)}
  #veille-dock:empty{display:none}
  /* Fermée, la colonne ne doit rien laisser derrière elle : son ombre portée
     resterait dessinée sur l'arbre. La règle du navigateur pour [hidden] ne
     suffit pas — le display:flex ci-dessus l'emporte. */
  #veille-dock[hidden]{display:none}
  @media (max-width:1000px){
    #veille-dock{top:auto;left:16px;right:16px;bottom:16px;width:auto;height:44vh}
  }

  /* Le retour : il remplace le cercle une fois qu'on s'est approché d'une
     branche. Dans l'angle libre, à gauche — la veille occupe la droite. */
  .retour{position:absolute;top:18px;left:18px;z-index:4;
    font-family:var(--display);font-weight:600;font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--mute);padding:10px 16px 10px 30px;
    border:1px solid var(--web2);border-radius:8px;background:rgba(13,27,44,.72);
    transition:color .2s,border-color .2s,background .2s}
  .retour::before{content:"";position:absolute;left:14px;top:50%;width:7px;height:7px;
    margin-top:-4px;border-left:1px solid currentColor;border-bottom:1px solid currentColor;
    transform:rotate(45deg)}
  .retour:hover{color:var(--star);border-color:var(--cuivre);background:rgba(20,38,60,.9)}
  .retour[hidden]{display:none}

  /* Le mois retenu ne déroule plus une fiche de choix : un cercle marqué d'un
     plus se pose sur sa pointe. Le seul geste qu'elle proposait vraiment —
     écrire — tient dans ce cercle ; lire les entrées du mois se fait déjà dans
     la colonne, sous l'arbre. */
  .plus{position:absolute;z-index:3;width:46px;height:46px;border-radius:50%;
    border:1px solid var(--web2);background:rgba(13,27,44,.72);color:var(--mute);
    box-shadow:0 10px 26px rgba(0,0,0,.45);
    transition:color .2s,border-color .2s,background .2s,transform .2s}
  .plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;
    background:currentColor;transform:translate(-50%,-50%)}
  .plus::before{width:15px;height:1.5px}
  .plus::after{width:1.5px;height:15px}
  .plus:hover{color:var(--star);border-color:var(--cuivre);
    background:rgba(20,38,60,.92);transform:scale(1.08)}
  .plus:focus-visible{outline:1px solid var(--cuivre);outline-offset:2px}
  .plus[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){.plus{transition:none}}

  /* la fiche d'un mois : elle s'accroche à son nœud */
  .detail{position:absolute;z-index:3;width:296px;max-width:calc(100% - 28px);
    font-family:var(--display);background:rgba(24,32,44,.94);
    border:1px solid rgba(130,165,205,.28);border-radius:10px;padding:13px 14px 12px;
    box-shadow:0 18px 46px rgba(0,0,0,.55)}
  .detail header{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
  .detail h4{margin:0;flex:1;font-weight:700;font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--star);line-height:1.45}
  .detail h4 span{color:var(--mute);font-weight:500}
  .detail header button{font-size:18px;line-height:.7;color:var(--faint);padding:0 2px}
  .detail header button:hover{color:var(--star)}
  .detail ol{list-style:none;margin:0;padding:0}
  .detail li{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13px;
    line-height:1.35;color:#cddaea;cursor:pointer;
    border-top:1px solid rgba(130,165,205,.12)}
  .detail li:first-child{border-top:none}
  .detail li:hover{color:#fff}
  .detail li b{font-weight:600;font-size:11px;color:var(--faint)}
  .detail li img{width:30px;height:30px;object-fit:cover;border-radius:4px;
    border:1px solid rgba(130,165,205,.25)}
  .detail li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .detail li.none{color:var(--faint);font-style:italic;cursor:default}
  .dact{display:flex;gap:8px;margin-top:11px}
  .dact button{flex:1;font-family:var(--display);font-weight:600;font-size:9.5px;
    letter-spacing:.13em;text-transform:uppercase;padding:9px 6px;border-radius:6px;
    border:1px solid rgba(130,165,205,.28);color:var(--mute);transition:.2s}
  .dact button:hover{color:#fff;border-color:rgba(130,165,205,.6);
    background:rgba(130,165,205,.12)}

  /* les chevrons de mois : discrets, aux deux bords de la carte */
  .step{position:absolute;top:50%;transform:translateY(-50%);z-index:2;
    width:46px;height:76px;display:flex;align-items:center;justify-content:center;
    color:var(--faint);opacity:.55;transition:opacity .22s,color .22s}
  .step:hover{color:var(--star);opacity:1}
  .step i{display:block;width:12px;height:12px;
    border-left:1px solid currentColor;border-bottom:1px solid currentColor}
  .step.prev{left:2px}
  .step.next{right:2px}
  .step.prev i{transform:rotate(45deg);margin-left:5px}
  .step.next i{transform:rotate(-135deg);margin-right:5px}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .sr-only:focus-within{position:static;width:auto;height:auto;clip:auto;margin:8px 0;
    display:flex;flex-wrap:wrap;gap:7px}
  .sr-only button{border:1px solid var(--web);color:var(--mute);font-family:var(--display);
    font-size:10px;letter-spacing:.16em;padding:6px 10px}

  /* ---------- lecture ---------- */
  .readout{min-height:210px;max-width:860px;margin:0 auto;
    border-top:1px solid var(--web);padding-top:14px}
  .footline{max-width:860px;margin-left:auto;margin-right:auto}
  .idle{color:var(--faint);font-family:var(--display);font-size:10px;letter-spacing:.3em;
    text-transform:uppercase;padding:34px 0;text-align:center}
  .rhead{display:flex;align-items:flex-end;gap:16px;margin-bottom:6px}
  .rtitle{flex:1;min-width:0}
  .rmonth{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.11em;
    text-transform:uppercase;line-height:1.1}
  .rsub{font-family:var(--prose);font-style:italic;font-size:14px;color:var(--mute);margin-top:3px}
  .act{font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--mute);padding:6px 0;white-space:nowrap;
    border-bottom:1px solid transparent;transition:.2s}
  .act:hover{color:var(--star);border-bottom-color:var(--star)}
  .act.lead{color:var(--star);border-bottom-color:var(--web2)}

  .rnav{display:flex;gap:22px;align-items:center;justify-content:space-between;
    padding:9px 0 0;margin-top:8px;border-top:1px solid rgba(150,160,205,.08)}
  .rlist{list-style:none;margin:8px 0 0;padding:0}
  .rlist li{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:baseline;
    padding:10px 0;border-top:1px solid rgba(150,160,205,.08);cursor:pointer}
  .rlist li:first-child{border-top:none}
  .rlist .day{font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.1em;
    color:var(--faint);text-transform:uppercase;transition:color .18s}
  .rlist .ttl{font-size:17px;line-height:1.4;color:#CFC9BE;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;transition:color .18s}
  .rlist li:hover .ttl{color:var(--star)}
  .rlist li:hover .day{color:var(--mute)}
  .rmore{font-family:var(--display);font-size:10px;letter-spacing:.2em;color:var(--faint);
    text-transform:uppercase;padding-top:12px}
  .rnone{font-style:italic;font-size:16px;color:var(--mute);padding:18px 0}

  .peek{padding:14px 0 2px;cursor:pointer}
  .peek .stamp{font-family:var(--display);font-weight:500;font-size:10px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--faint)}
  .peek h3{margin:7px 0 7px;font-weight:400;font-size:22px;line-height:1.25;color:var(--star)}
  .peek p{margin:0;font-size:16px;line-height:1.65;color:#BFB9AE;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tags{margin-top:11px;display:flex;flex-wrap:wrap;gap:9px}
  .tag{font-family:var(--display);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--mute);border-bottom:1px solid var(--web)}
  .tag.mood{color:var(--star);border-bottom-color:var(--web2)}
  .fade{animation:fu .3s ease-out both}
  @keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}}

  .footline{display:flex;justify-content:space-between;align-items:center;
    margin-top:22px;padding-top:14px;border-top:1px solid var(--web)}
  .note{font-family:var(--display);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--faint)}
  .note.warn{color:var(--rose);letter-spacing:.1em;text-transform:none;font-size:12px;
    font-family:var(--prose);font-style:italic}

  /* ---------- panneau ---------- */
  .veil{position:fixed;inset:0;z-index:4;background:rgba(3,4,9,.78);opacity:0;
    pointer-events:none;transition:opacity .26s}
  .veil.on{opacity:1;pointer-events:auto}
  /* la fenêtre d'écriture : au milieu de l'écran, posée sur la carte */
  .panel{position:fixed;z-index:5;display:flex;flex-direction:column;
    left:50%;top:50%;width:min(560px,calc(100vw - 32px));max-height:min(86vh,780px);
    background:var(--ink2);border:1px solid var(--web2);
    box-shadow:0 30px 90px rgba(2,3,8,.72);
    opacity:0;pointer-events:none;transform:translate(-50%,-48%) scale(.985);
    transition:opacity .22s,transform .3s cubic-bezier(.2,.75,.25,1)}
  .panel.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  @media (prefers-reduced-motion:reduce){.panel{transition:none}}
  .phead{display:flex;align-items:flex-start;gap:16px;padding:26px 26px 18px}
  .phead .stamp{flex:1;font-family:var(--display);font-weight:500;font-size:10.5px;
    letter-spacing:.26em;text-transform:uppercase;color:var(--mute);padding-top:4px}
  .shut{font-size:22px;line-height:.8;color:var(--faint);padding:2px 4px;transition:color .2s}
  .shut:hover{color:var(--star)}
  .pbody{flex:1;overflow-y:auto;padding:0 26px 30px;-webkit-overflow-scrolling:touch}
  .pfoot{padding:16px 26px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--web)}

  .solid{width:100%;background:var(--star);color:#0A0C15;font-family:var(--display);
    font-weight:600;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
    padding:15px;transition:opacity .2s}
  .solid:hover{opacity:.86}
  .solid[disabled]{opacity:.45;cursor:default}
  .hollow{border:1px solid var(--web);color:var(--mute);font-family:var(--display);
    font-weight:500;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
    padding:15px 22px;transition:.2s}
  .hollow:hover{color:var(--star);border-color:var(--web2)}
  .pair{display:flex;gap:12px}
  .pair .solid{flex:1}

  .read h3{margin:0 0 12px;font-weight:400;font-size:27px;line-height:1.22;color:var(--star)}
  .read p{margin:0;font-size:17px;line-height:1.78;color:#C4BEB3;white-space:pre-wrap}
  .read .src{margin-top:18px;font-size:14px}
  .read .src a{color:var(--mute);text-decoration:none;word-break:break-all;
    border-bottom:1px solid var(--web);transition:.2s}
  .read .src a:hover{color:var(--star);border-bottom-color:var(--star)}
  .read img{margin-top:18px;max-width:100%;display:block;cursor:zoom-in;border:1px solid var(--web)}
  .kill{margin-top:26px;font-family:var(--display);font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--faint);border-bottom:1px solid transparent;padding-bottom:2px}
  .kill:hover{color:var(--rose);border-bottom-color:var(--rose)}
  .blank{margin:34px 0;font-style:italic;font-size:17px;line-height:1.7;color:var(--mute)}

  .fld{margin:22px 0}
  .fld label{display:block;font-family:var(--display);font-weight:500;font-size:9.5px;
    letter-spacing:.24em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
  .fld input[type=text],.fld input[type=date],.fld textarea{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--web);
    color:var(--star);padding:8px 0;border-radius:0;font-family:var(--prose);
    font-size:17px;font-weight:300;transition:border-color .2s}
  .fld textarea{line-height:1.75;min-height:170px;resize:vertical}
  .fld input:focus,.fld textarea:focus{outline:none;border-bottom-color:var(--star)}
  .fld input::placeholder,.fld textarea::placeholder{color:var(--faint);font-style:italic}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
  /* le choix de catégorie : la pastille prend la couleur du fruit correspondant */
  .swatch{display:flex;flex-wrap:wrap;gap:8px}
  .swatch button{font-family:var(--display);font-weight:600;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:7px 11px;
    border:1px solid var(--web);border-radius:6px;transition:.18s}
  .swatch button:hover{color:var(--star);border-color:var(--web2)}
  .swatch button[aria-pressed=true]{color:#0d131c;background:var(--h);border-color:var(--h)}
  @media (max-width:520px){ .duo{grid-template-columns:1fr} }
  .shots{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .shots img{height:58px;border:1px solid var(--web)}
  input[type=file]{font-family:var(--display);font-size:11px;letter-spacing:.08em;color:var(--faint);max-width:100%}
  input[type=file]::file-selector-button{font-family:var(--display);font-weight:500;font-size:9.5px;
    letter-spacing:.2em;text-transform:uppercase;background:none;border:1px solid var(--web);
    color:var(--mute);padding:9px 13px;margin-right:14px;cursor:pointer}
  input[type=date]{color-scheme:dark}
  .alert{margin:14px 0 0;font-family:var(--prose);font-style:italic;font-size:14px;color:var(--rose)}
  .alert:empty{display:none}

  .loupe{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
    background:rgba(3,4,9,.96);padding:22px}
  .loupe.on{display:flex}
  .loupe img{max-width:100%;max-height:100%}
</style>

<div class="shell">
  <header class="masthead">
    <span class="wordmark">Journal de bord</span>
    <nav class="yearnav">
      <button id="prevY"></button>
      <button id="nextY"></button>
      <span id="veille"></span>
    </nav>
  </header>

  <div class="plate">
    <button class="step prev" id="prevM" type="button"><i></i></button>
    <button class="step next" id="nextM" type="button"><i></i></button>
    <button class="retour" id="retour" type="button" hidden>Retour</button>
    <div id="veille-dock" aria-label="Veille Systèmes d'information"></div>
    <button class="plus" id="plus" type="button" hidden></button>
    <aside class="detail" id="detail" hidden>
      <header>
        <h4 id="detailTitle"></h4>
        <button id="detailShut" type="button" aria-label="Fermer la fiche">&#215;</button>
      </header>
      <ol id="detailList"></ol>
      <div class="dact">
        <button id="detailWrite" type="button">Écrire</button>
        <button id="detailAll" type="button">Voir toutes les entrées</button>
      </div>
    </aside>
    <canvas id="chart" tabindex="0" role="application"
      aria-label="Carte du mois. Chaque point est une entrée, le cercle marqué d'un plus ouvre l'écriture. Flèches pour parcourir les entrées, Entrée pour ouvrir, Maj plus flèches pour changer de mois, Échap pour recentrer."></canvas>
  </div>
  <nav class="sr-only" id="srnav" aria-label="Mois"></nav>

  <div class="readout" id="readout" aria-live="polite"></div>

  <div class="footline">
    <span class="note" id="note"></span>
    <button class="act" id="exportBtn">Exporter</button>
  </div>
</div>

<div class="veil" id="veil"></div>

<section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pstamp" aria-hidden="true">
  <header class="phead">
    <span class="stamp" id="pstamp"></span>
    <button class="shut" id="shut" aria-label="Fermer">&#215;</button>
  </header>
  <div class="pbody" id="pbody"></div>
  <footer class="pfoot" id="pfoot"></footer>
</section>

<div class="loupe" id="loupe"><img id="loupeImg" alt=""></div>

<script>
(function(){
  "use strict";

  var MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin",
                "Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  var SHORT  = ["janv","févr","mars","avril","mai","juin",
                "juil","août","sept","oct","nov","déc"];
  var LANGS  = ["français","anglais","espagnol","portugais","arabe","allemand",
                "italien","russe","chinois","japonais"];
  var PREVIEW = 6, INDEX_LIMIT = 4300000;
  var motion = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  /* ---------------- stockage ---------------- */
  /* Quatre niveaux de conservation, du plus sûr au moins sûr :
       1. le SERVEUR    — une base qui survit aux redéploiements et se partage
                          entre vos appareils. C'est la référence : ce qu'elle
                          contient l'emporte à la lecture ;
       2. window.storage — l'API de la page hôte, s'il y en a une ;
       3. localStorage   — le navigateur, qui sert aussi de cache hors ligne
                          et de filet quand le serveur ne répond pas ;
       4. la mémoire vive — dernier recours (navigation privée, stockage bloqué).
     Toute écriture va au serveur ET au cache local : si le serveur est
     injoignable, le texte n'est pas perdu, il est simplement local ce jour-là.
     On le dit alors à l'écran plutôt que de laisser croire à une sauvegarde.  */
  var API = "/api/journal/";
  var serveurOk = null;              // null tant qu'on n'a pas essayé
  var horsLigne = false;             // vrai dès qu'une écriture n'a pas pu partir

  function versServeur(k){ return API + encodeURIComponent(k); }
  function litServeur(k){
    return fetch(versServeur(k), { credentials:"include" }).then(function(r){
      if(r.status === 404){ serveurOk = true; return null; }
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json().then(function(d){ serveurOk = true; return d.value; });
    });
  }
  function ecritServeur(k, v){
    return fetch(versServeur(k), {
      method: "PUT", credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: v })
    }).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      serveurOk = true; return true;
    });
  }
  function effaceServeur(k){
    return fetch(versServeur(k), { method:"DELETE", credentials:"include" })
           .then(function(){ return true; });
  }

  var hasStore = (typeof window.storage === "object" && window.storage !== null &&
                  typeof window.storage.get === "function");
  var hasLocal = (function(){
    try{
      var probe = "jdb:probe";
      window.localStorage.setItem(probe, "1");
      window.localStorage.removeItem(probe);
      return true;
    }catch(e){ return false; }
  })();
  var mem = {};
  function litLocal(k){
    if(hasStore)
      return window.storage.get(k,false).then(function(r){ return r ? r.value : null; })
             .catch(function(){ return null; });
    if(hasLocal){
      try{ return Promise.resolve(window.localStorage.getItem(k)); }
      catch(e){ return Promise.resolve(null); }
    }
    return Promise.resolve(Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null);
  }
  function ecritLocal(k, v){
    if(hasStore)
      return window.storage.set(k,v,false).then(function(r){ return !!r; })
             .catch(function(){ return false; });
    if(hasLocal){
      try{ window.localStorage.setItem(k, v); return Promise.resolve(true); }
      catch(e){ return Promise.resolve(false); }     // quota dépassé
    }
    mem[k]=v; return Promise.resolve(true);
  }
  function effaceLocal(k){
    if(hasStore)
      return window.storage.delete(k,false).then(function(){ return true; })
             .catch(function(){ return false; });
    if(hasLocal){
      try{ window.localStorage.removeItem(k); }catch(e){}
      return Promise.resolve(true);
    }
    delete mem[k]; return Promise.resolve(true);
  }

  /* On dit franchement où atterrit ce qui est écrit. Trois cas seulement, et
     l'utilisateur doit pouvoir les distinguer d'un coup d'œil : sauvegardé
     partout, sauvegardé ici seulement, ou pas sauvegardé du tout. */
  function noteStockage(){
    if(!hasStore && !hasLocal && serveurOk !== true)
      return setNote("Stockage indisponible : les entrées ne seront pas conservées.", true);
    if(horsLigne || serveurOk === false)
      return setNote("Serveur injoignable : enregistré dans ce navigateur seulement.", true);
    if(serveurOk === true) return setNote("Entrées enregistrées sur le serveur.");
    setNote("Entrées conservées dans ce navigateur.");
  }

  var store = {
    /* Le serveur fait foi ; le cache local prend le relais s'il ne répond pas.
       On rafraîchit le cache au passage, pour que la lecture hors ligne
       retrouve la dernière version connue. */
    get: function(k){
      return litServeur(k).then(function(v){
        if(v === null) return litLocal(k);        // absent du serveur : peut-être local
        ecritLocal(k, v);
        return v;
      }).catch(function(){
        serveurOk = false;
        return litLocal(k);
      });
    },
    /* On écrit d'abord en local — c'est immédiat et ça ne peut pas échouer en
       route — puis on pousse au serveur. Un échec réseau ne fait donc jamais
       perdre le texte : il le laisse seulement dans ce navigateur. */
    set: function(k,v){
      return ecritLocal(k, v).then(function(okLocal){
        return ecritServeur(k, v).then(function(){
          if(horsLigne){ horsLigne = false; noteStockage(); }
          return true;
        }).catch(function(){
          if(!horsLigne){ horsLigne = true; noteStockage(); }
          return okLocal;
        });
      });
    },
    del: function(k){
      return effaceLocal(k).then(function(){
        return effaceServeur(k).catch(function(){ return true; });
      });
    }
  };
  function yearKey(y){ return "jdb:v1:" + y; }
  function imgKey(id){ return "jdb:img:" + id; }

  /* ---------------- état ---------------- */
  var today = new Date();
  // focus : le mois retenu, celui dont la fiche est ouverte (null si aucune).
  // hover : le mois sous le curseur, pour l'éclairer sans rien engager.
  /* focus : le mois dont la fiche est ouverte · fruit : la catégorie retenue
     hover / pip / hoverMonth : ce que le curseur éclaire, sans rien engager. */
  var state = {
    year: today.getFullYear(), entries: [],
    focus: null, fruit: null, hover: null, pip: null, hoverMonth: null,
    loading: true, pendingPhoto: undefined, editing: null
  };

  function monthOf(e){ return parseInt(e.date.slice(5,7),10) - 1; }
  function byMonth(m){
    return state.entries.filter(function(e){ return monthOf(e) === m; })
      .sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function entryById(id){ return state.entries.filter(function(e){ return e.id === id; })[0] || null; }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function pad(n){ return n < 10 ? "0" + n : String(n); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function labelOf(e){ return e.title || (e.body || "").split("\n")[0] || "sans titre"; }
  function dayStamp(e){ return pad(parseInt(e.date.slice(8,10),10)) + " " + SHORT[monthOf(e)]; }

  // À l'ouverture d'une année : le mois courant si c'est l'année courante, sinon
  // le dernier mois qui a quelque chose à montrer. Jamais une page vide.
  function firstMonth(){
    if(state.year === today.getFullYear()) return today.getMonth();
    for(var i = 11; i >= 0; i--) if(byMonth(i).length) return i;
    return 0;
  }
  function loadYear(){
    state.loading = true; state.hover = null; state.focus = null;
    document.getElementById("prevY").textContent = "← " + (state.year - 1);
    document.getElementById("nextY").textContent = (state.year + 1) + " →";

    return store.get(yearKey(state.year)).then(function(raw){

      state.entries = (data && Array.isArray(data.entries)) ? data.entries : [];

  function saveYear(){
    var payload = JSON.stringify({ v:1, year:state.year, entries:state.entries });

        msg:"Cette année a atteint sa limite. Exportez-la, puis retirez quelques entrées avec photo." });
    }
