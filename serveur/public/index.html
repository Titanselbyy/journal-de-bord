      return ok ? {ok:true} : {ok:false, msg:"Rien n'a été enregistré. Réessayez."};
    });
  }

  /* ================= la carte ================= */
  var cv = document.getElementById("chart"), ctx = cv.getContext("2d");
  var W = 0, H = 0, S = 1, dpr = 1;
  var GOLD = 2.399963;

  /* --------- l'arbre ---------
     Dessiné d'après la référence : bois cuivré éclairé de biais, branches
     longues et effilées en aiguille, base en deux arcs qui s'ouvrent en coupe,
     feuilles vert sauge. La couleur ne sert qu'aux feuilles — une catégorie,
     une teinte — pour que le bois reste d'une seule matière.

     Cinq étages : le tronc porte le sujet, quatre branches les trimestres,
     douze rameaux les mois, les feuilles les catégories, et les actualités
     s'égrènent le long du pétiole quand on approche.                          */

  var BOIS = { clair:"#e8b085", moyen:"#c9885c", sombre:"#8a5231", coeur:"#a8663c" };

  var CATS = [
    { id:"securite",   name:"Sécurité",       hue:"#c9705e", soft:"#e8a294" },
    { id:"infra",      name:"Infrastructure", hue:"#6d8fae", soft:"#a3c0d8" },
    { id:"donnees",    name:"Données",        hue:"#9a7fa8", soft:"#c8b2d2" },
    { id:"innovation", name:"Innovation",     hue:"#7d9268", soft:"#a9bf94" },
    { id:"reglement",  name:"Réglementation", hue:"#c9a961", soft:"#e6cf96" },
    { id:"metier",     name:"Métier",         hue:"#7f8a99", soft:"#aeb8c6" }
  ];
  var CAT_BY_ID = {};
  CATS.forEach(function(c){ CAT_BY_ID[c.id] = c; });

  var CAT_RULES = [
    ["securite",   /s[ée]curit|faille|vuln[ée]rab|ransomware|cyber|piratage|attaque|CERT|CVE|phishing|fuite/i],
    ["reglement",  /RGPD|GDPR|NIS ?2|DORA|AI Act|loi|d[ée]cret|directive|CNIL|amende|sanction|conformit|juridique/i],
    ["donnees",    /donn[ée]es|data|base de donn|entrep[ôo]t|ETL|BI\b|analytics|d[ée]cisionnel/i],
    ["infra",      /infrastructure|cloud|serveur|r[ée]seau|datacenter|kubernetes|virtualis|h[ée]bergement|sauvegarde|SaaS/i],
    ["innovation", /\bIA\b|\bAI\b|intelligence artificielle|innovation|LLM|machine learning|quantique|blockchain|recherche/i],
    ["metier",     /DSI|ERP|SIRH|CRM|m[ée]tier|organisation|projet|gouvernance|budget|march[ée]|contrat|prestataire/i]
  ];
  function catOf(e){
    if(e.cat && CAT_BY_ID[e.cat]) return e.cat;
    var text = (e.title || "") + " " + (e.body || "") + " " + (e.tags || []).join(" ");
    for(var i = 0; i < CAT_RULES.length; i++)
      if(CAT_RULES[i][1].test(text)) return CAT_RULES[i][0];
    return "metier";
  }

  /* Le monde : 1600 de large, l'arbre posé au milieu, la coupe en bas. */
  var SOL = 980, AXE = 800, FOURCHE = 560;

  /* Les quatre branches maîtresses. La référence en montre six, deux basses très
     ouvertes et quatre montantes ; on garde ce dessin avec quatre trimestres :
     deux bas et larges, deux hauts et dressés. */
  var QUARTERS = [
    { tag:"T1 · JANV — MARS",  cote:-1, depart:0.16, angle:-2.62, len:430, courbe:-0.30 },
    { tag:"T2 · AVRIL — JUIN", cote:-1, depart:0.55, angle:-1.94, len:470, courbe:-0.16 },
    { tag:"T3 · JUIL — SEPT",  cote: 1, depart:0.55, angle:-1.20, len:470, courbe: 0.16 },
    { tag:"T4 · OCT — DÉC",    cote: 1, depart:0.16, angle:-0.52, len:430, courbe: 0.30 }
  ];
  var LIMB_T = [0.34, 0.60, 0.86];      // où chaque mois quitte sa branche
  var LIMB_A = [0.46, -0.34, 0.10];     // et de quel côté il s'écarte

  /* Une courbe = trois points. On l'échantillonne pour tracer et pour placer. */
  function quad(p0, c, p1, t){
    var u = 1 - t;
    return { x: u*u*p0.x + 2*u*t*c.x + t*t*p1.x,
             y: u*u*p0.y + 2*u*t*c.y + t*t*p1.y };
  }
  function angleOf(f, t){
    var a = f(Math.max(0, t - 0.03)), b = f(Math.min(1, t + 0.03));
    return Math.atan2(b.y - a.y, b.x - a.x);
  }

  function trunkAt(t){                       // le tronc, du sol à la fourche
    return { x: AXE, y: SOL - (SOL - FOURCHE) * t };
  }
  function quarterOf(q){
    var Q = QUARTERS[q];
    var p0 = trunkAt(0.30 + Q.depart * 0.70);
    var p1 = { x: p0.x + Math.cos(Q.angle) * Q.len,
               y: p0.y + Math.sin(Q.angle) * Q.len };
    // le point de contrôle décalé donne le galbe : la branche part dans l'axe
    // du tronc puis s'ouvre, au lieu de filer droit
    var mid = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
    var c = { x: mid.x - Math.sin(Q.angle) * Q.len * Q.courbe,
              y: mid.y + Math.cos(Q.angle) * Q.len * Q.courbe - Q.len * 0.16 };
    return { p0: p0, c: c, p1: p1, at: function(t){ return quad(p0, c, p1, t); } };
  }
  function limbOf(q, k){
    var Q = QUARTERS[q], br = quarterOf(q);
    var t0 = LIMB_T[k];
    var p0 = br.at(t0);
    var base = angleOf(br.at, t0);
    var ang = base + LIMB_A[k] * Q.cote + (rnd(q * 5 + k) - 0.5) * 0.16;
    var len = (250 - k * 26) * (0.9 + rnd(q * 9 + k * 3) * 0.24);
    var p1 = { x: p0.x + Math.cos(ang) * len, y: p0.y + Math.sin(ang) * len };
    var mid = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
    var c = { x: mid.x - Math.sin(ang) * len * 0.18 * Q.cote,
              y: mid.y + Math.cos(ang) * len * 0.18 * Q.cote };
    return { p0: p0, c: c, p1: p1, ang: ang,
             at: function(t){ return quad(p0, c, p1, t); } };
  }

  var cam = { x:800, y:520, k:1.0, tx:800, ty:520, tk:1.0 };
  var KMIN = 0.7, KMAX = 4.0, GLIDE = 0.09, ZOOMV = 0.08;
  var lastPt = null;
  var months = [];

  function rnd(seed){ var x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function wpx(v){ return v * S * cam.k; }
  function dpx(v){ return v * S * 1.35 * Math.pow(cam.k, 0.5); }
  function X(x){ return (x - cam.x) * S * cam.k + W / 2; }
  function Y(y){ return (y - cam.y) * S * cam.k + H / 2; }

  var K_LEAF = 1.25;      // les feuilles se nomment à partir de ce zoom
  var K_PIP  = 2.20;      // les actualités apparaissent à partir de celui-là

  function build(){
    var was = {};
    months.forEach(function(m){ was[m.i] = m.glow; });
    months = [];
    for(var i = 0; i < 12; i++){
      var q = (i / 3) | 0, k = i % 3;
      var limb = limbOf(q, k);
      var list = byMonth(i);
      var bucket = {};
      list.forEach(function(e){ (bucket[catOf(e)] = bucket[catOf(e)] || []).push(e); });
      var present = CATS.filter(function(c){ return bucket[c.id]; });

      /* Les feuilles se répartissent le long du rameau, alternées de part et
         d'autre — comme sur la référence, où elles ne poussent jamais toutes
         du même côté ni au même endroit. */
      var feuilles = present.map(function(c, fi){
        var n = present.length;
        var t = 0.46 + (n === 1 ? 0.24 : (fi / (n - 1)) * 0.46);
        var base = limb.at(t);
        var ang = angleOf(limb.at, t);
        var cote = (fi % 2 === 0) ? 1 : -1;
        var ouvert = ang + cote * 1.02;                 // le pétiole s'écarte
        var entries = bucket[c.id].slice().sort(function(a, b){
          return a.date < b.date ? 1 : -1; });
        var taille = 52 + Math.min(entries.length, 12) * 3.4;
        return {
          cat: c, month: i, key: i + ":" + c.id, t: t, ang: ouvert, cote: cote,
          base: base,
          x: base.x + Math.cos(ouvert) * taille * 0.9,
          y: base.y + Math.sin(ouvert) * taille * 0.9,
          r: taille, entries: entries, glow: 0,
          pips: entries.slice(0, 8).map(function(e, pi, arr){
            return { id: e.id, u: (pi + 1) / (arr.length + 1) };
          })
        };
      });
      months.push({ i:i, q:q, k:k, limb:limb, n:list.length, feuilles:feuilles,
                    x:limb.p1.x, y:limb.p1.y, glow: was[i] || 0 });
    }
    if(!motion) draw();
  }
  function allLeaves(){
    var out = [];
    months.forEach(function(m){ m.feuilles.forEach(function(f){ out.push(f); }); });
    return out;
  }

  function step(){
    glisseVue();
    if(state.focus !== null && !cardEl.hidden) placeCard();
    placePlus();
    if(lastPt && !(panel && panel.classList.contains("on")))
      look(lastPt.x, lastPt.y);
    cam.x += (cam.tx - cam.x) * GLIDE;
    cam.y += (cam.ty - cam.y) * GLIDE;
    cam.k += (cam.tk - cam.k) * ZOOMV;
    months.forEach(function(m){
      var want = (state.focus === m.i) ? 1 : (state.hoverMonth === m.i ? 0.55 : 0);
      m.glow += (want - m.glow) * 0.14;
      m.feuilles.forEach(function(f){
        var w2 = (state.fruit === f.key) ? 1 : (state.hover === f.key ? 0.6 : 0);
        f.glow += (w2 - f.glow) * 0.16;
      });
    });
  }
  function settle(){ for(var n = 0; n < 60; n++) step();
                     cam.x = cam.tx; cam.y = cam.ty; cam.k = cam.tk; }

  function clampK(k){ return Math.max(KMIN, Math.min(KMAX, k)); }
  function clampCam(){
    var lt = Math.max(0, 560 - 460 / cam.tk);
    cam.tx = Math.max(800 - lt, Math.min(800 + lt, cam.tx));
    cam.ty = Math.max(520 - lt * 0.8, Math.min(520 + lt * 0.8, cam.ty));
    var lc = Math.max(0, 560 - 460 / cam.k);
    cam.x = Math.max(800 - lc, Math.min(800 + lc, cam.x));
    cam.y = Math.max(520 - lc * 0.8, Math.min(520 + lc * 0.8, cam.y));
  }
  function zoomAt(cx, cy, factor){
    var before = toWorld(cx, cy);
    if(!before) return;
    cam.k = cam.tk = clampK(cam.k * factor);
    var after = toWorld(cx, cy);
    cam.x = cam.tx = cam.x + (before.x - after.x);
    cam.y = cam.ty = cam.y + (before.y - after.y);
    clampCam(); placeCard();
    if(!motion){ settle(); draw(); }
  }
  /* Le cadrage tient compte de la colonne de veille : au-delà de 1000 px elle
     mange 356 px à droite, l'arbre doit donc se centrer dans ce qui reste,
     sinon il se retrouve poussé dans l'angle. */
  function cadre(){
    var occupe = (W > 1000) ? 356 : 0;
    var k = Math.min(1.0, (H - 40) / (1020 * S));
    return { x: 800 + (occupe / 2) / (S * k), y: 566, k: k };
  }
  function recentre(){
    var c = cadre();
    cam.tx = c.x; cam.ty = c.y; cam.tk = c.k;
    if(!motion){ settle(); draw(); }
  }
  function zoomTo(f){
    cam.tx = f.x; cam.ty = f.y; cam.tk = Math.max(cam.tk, K_PIP + 0.3);
    clampCam();
    if(!motion){ settle(); draw(); }
  }
  function resize(){
    var r = cv.getBoundingClientRect();
    if(!r.width) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    S = Math.min(W, H) / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if(!vu){ vu = true; poseVue(); }
    else if(state.focus === null || !moisOuvert()) poseVue();
    else viseMois(state.focus);
    placeCard(); placePlus();
    if(!motion) draw();
  }
  var vu = false;           // premier cadrage, une fois la taille connue
  var thumbs = {};
  function thumbFor(id){
    var e = entryById(id);
    if(!e || !e.thumb) return null;
    var im = thumbs[id];
    if(!im){
      im = thumbs[id] = new Image();
      im.onload = function(){ if(!motion) draw(); };
      im.src = e.thumb;
    }
    return (im.complete && im.naturalWidth) ? im : null;
  }
  function hexa(hex, a){
    var n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }
  function fade(k, from, to){ return Math.max(0, Math.min(1, (k - from) / (to - from))); }

  /* Le bois. Deux principes tirés de la référence :
     — la branche s'affine jusqu'à la pointe d'aiguille, pas jusqu'à un moignon ;
     — elle est éclairée DE BIAIS : un bord clair, un bord sombre. C'est ce
       dégradé en travers, et lui seul, qui donne le volume cylindrique. */
  function rameau(f, w0, w1, steps){
    var L = [], R = [], i, t, p, a, b, dx, dy, len, nx, ny, w;
    for(i = 0; i <= steps; i++){
      t = i / steps;
      p = f(t);
      a = f(Math.max(0, t - 0.02)); b = f(Math.min(1, t + 0.02));
      dx = b.x - a.x; dy = b.y - a.y;
      len = Math.hypot(dx, dy) || 1;
      nx = -dy / len; ny = dx / len;
      // (1-t)^0.62 : épais longtemps, puis effilé net — la pointe d'aiguille
      w = (w1 + (w0 - w1) * Math.pow(1 - t, 0.62)) / 2;
      L.push({ x: p.x + nx * w, y: p.y + ny * w });
      R.push({ x: p.x - nx * w, y: p.y - ny * w });
    }
    ctx.beginPath();
    ctx.moveTo(X(L[0].x), Y(L[0].y));
    for(i = 1; i < L.length; i++) ctx.lineTo(X(L[i].x), Y(L[i].y));
    for(i = R.length - 1; i >= 0; i--) ctx.lineTo(X(R[i].x), Y(R[i].y));
    ctx.closePath();
    return { L: L, R: R };
  }
  /* Le dégradé en travers : son axe est la normale au milieu de la branche. */
  function bois(bords, alpha){
    var m = Math.floor(bords.L.length / 2);
    var g = ctx.createLinearGradient(X(bords.L[m].x), Y(bords.L[m].y),
                                     X(bords.R[m].x), Y(bords.R[m].y));
    g.addColorStop(0,    hexa(BOIS.clair, alpha));
    g.addColorStop(0.34, hexa(BOIS.moyen, alpha));
    g.addColorStop(0.75, hexa(BOIS.coeur, alpha));
    g.addColorStop(1,    hexa(BOIS.sombre, alpha));
    return g;
  }
  function traceBois(f, w0, w1, steps, alpha){
    var b = rameau(f, w0, w1, steps);
    ctx.fillStyle = bois(b, alpha === undefined ? 1 : alpha);
    ctx.fill();
  }

  /* La feuille : ovale à pointe, nervure centrale, posée sur son pétiole. */
  function feuille(f, showName, fnt){
    var bx = X(f.base.x), by = Y(f.base.y);
    var lx = X(f.x), ly = Y(f.y);
    var r = dpx(f.r) * (1 + f.glow * 0.09);
    var ang = Math.atan2(ly - by, lx - bx);

    ctx.strokeStyle = hexa(BOIS.moyen, 0.85);      // le pétiole
    ctx.lineWidth = Math.max(1, dpx(1.5));
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(lx, ly); ctx.stroke();

    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(ang);
    var L = r, l = r * 0.42;
    var g = ctx.createLinearGradient(0, -l, 0, l);
    g.addColorStop(0, hexa(f.cat.soft, 0.95));
    g.addColorStop(1, hexa(f.cat.hue, 0.92));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(L * 0.42, -l, L, 0);      // le dessus
    ctx.quadraticCurveTo(L * 0.42, l, 0, 0);       // le dessous
    ctx.closePath();
    ctx.fill();
    if(state.fruit === f.key || f.glow > 0.5){
      ctx.strokeStyle = "rgba(248,244,236," + (0.35 + f.glow * 0.55).toFixed(2) + ")";
      ctx.lineWidth = Math.max(1, dpx(1.3));
      ctx.stroke();
    }
    ctx.strokeStyle = hexa(f.cat.soft, 0.5);       // la nervure
    ctx.lineWidth = Math.max(0.6, dpx(0.8));
    ctx.beginPath(); ctx.moveTo(L * 0.06, 0); ctx.lineTo(L * 0.9, 0); ctx.stroke();
    ctx.restore();

    if(showName > 0.02){
      ctx.font = '600 ' + (fnt * 0.62).toFixed(1) + 'px "Syne",Helvetica,sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.letterSpacing = "0.14em";
      ctx.fillStyle = hexa(f.cat.soft, 0.9 * showName);
      ctx.fillText(f.cat.name.toUpperCase() + "  " + f.entries.length,
                   lx + Math.cos(ang) * r * 0.55, ly + Math.abs(Math.sin(ang)) * 4 + dpx(11));
      ctx.letterSpacing = "0px";
    }
  }

  /* L'arbre n'est plus dessiné : c'est l'image de fond. Le canevas ne porte
     plus que ce qui doit réagir — étiquettes, feuilles de catégories,
     actualités — posé par-dessus. */
  var DESSINE_BOIS = false;

  function draw(){
    if(!W) return;
    ctx.clearRect(0, 0, W, H);
    var f = Math.max(11, Math.min(26, W * 0.0135));
    var i, m, q;
    var vueFeuille = fade(cam.k, K_LEAF - 0.35, K_LEAF + 0.15);
    var vuePepin = fade(cam.k, K_PIP - 0.5, K_PIP + 0.2);
    if(!DESSINE_BOIS) return dessineParDessus(f, vueFeuille, vuePepin);

    /* --- la coupe : deux arcs qui s'ouvrent, comme sur la référence --- */
    for(var s = -1; s <= 1; s += 2){
      (function(cote){
        /* La coupe : chaque arc part du tronc vers le haut, s'incurve vers
           l'extérieur puis redescend en cercle jusqu'au sol. Les deux ensemble
           dessinent le calice ouvert de la référence. */
        traceBois(function(t){
          var a = -Math.PI * 0.62 + t * Math.PI * 1.16;   // du haut vers le bas
          var R = 168;
          return { x: AXE + cote * (R * Math.sin(a) + R * 0.62),
                   y: SOL - 150 - R * Math.cos(a) * 0.98 };
        }, 30, 2.5, 30);
      })(s);
    }

    /* --- le tronc, en deux brins accolés --- */
    for(var b = -1; b <= 1; b += 2){
      (function(cote){
        traceBois(function(t){
          var p = trunkAt(t);
          return { x: p.x + cote * (9 - t * 4), y: p.y };
        }, 44, 17, 22);
      })(b);
    }

    /* --- les quatre branches --- */
    for(q = 0; q < 4; q++){
      var br = quarterOf(q);
      var vivant = months[q*3].n + months[q*3+1].n + months[q*3+2].n > 0;
      traceBois(br.at, vivant ? 27 : 20, 1.2, 34, vivant ? 1 : 0.82);

      var lp = br.at(0.42), la = angleOf(br.at, 0.42);
      ctx.save();
      ctx.translate(X(lp.x), Y(lp.y));
      ctx.rotate(Math.abs(la) > Math.PI / 2 ? la + Math.PI : la);
      ctx.font = '600 ' + (f * 0.66).toFixed(1) + 'px "Syne",Helvetica,sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.letterSpacing = "0.2em";
      ctx.fillStyle = "rgba(226,214,198," + (vivant ? 0.7 : 0.35) + ")";
      ctx.fillText(QUARTERS[q].tag, 0, -dpx(13));
      ctx.letterSpacing = "0px";
      ctx.restore();
    }

    /* --- les douze rameaux --- */
    for(i = 0; i < 12; i++){
      m = months[i];
      traceBois(m.limb.at, m.n ? 14 : 9, 0.8, 24, m.n ? 1 : 0.78);

      var mp = m.limb.at(0.995), ma = angleOf(m.limb.at, 0.9);
      ctx.save();
      ctx.translate(X(mp.x), Y(mp.y));
      ctx.rotate(Math.abs(ma) > Math.PI / 2 ? ma + Math.PI : ma);
      ctx.font = '600 ' + (f * 0.6).toFixed(1) + 'px "Syne",Helvetica,sans-serif';
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.letterSpacing = "0.2em";
      ctx.fillStyle = m.n ? "rgba(240,232,220," + (0.62 + m.glow * 0.38).toFixed(2) + ")"
                          : "rgba(180,172,162,.34)";
      ctx.fillText(SHORT[i].toUpperCase() + (m.n ? "  " + m.n : ""), dpx(16), -dpx(5));
      ctx.letterSpacing = "0px";
      ctx.restore();
    }

    /* --- les feuilles, et les actualités le long du pétiole --- */
    for(i = 0; i < 12; i++){
      m = months[i];
      for(var fi = 0; fi < m.feuilles.length; fi++){
        var fe = m.feuilles[fi];
        if(vuePepin > 0.02){
          for(var pi = 0; pi < fe.pips.length; pi++){
            var p = fe.pips[pi];
            var px = X(fe.base.x + (fe.x - fe.base.x) * p.u * 0.85);
            var py = Y(fe.base.y + (fe.y - fe.base.y) * p.u * 0.85);
            var chaud = state.pip === p.id;
            ctx.fillStyle = chaud ? "rgba(248,244,236," + vuePepin.toFixed(2) + ")"
                                  : hexa(fe.cat.soft, 0.85 * vuePepin);
            ctx.beginPath();
            ctx.arc(px, py, dpx(chaud ? 4.2 : 2.9), 0, 6.2832);
            ctx.fill();
          }
        }
        feuille(fe, vueFeuille, f);
      }
    }

    /* --- le sujet, au pied --- */
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.font = '700 ' + (f * 1.12).toFixed(1) + 'px "Syne",Helvetica,sans-serif';
    ctx.letterSpacing = "0.26em";
    ctx.fillStyle = "rgba(240,232,220,.95)";
    ctx.fillText("LES SYSTÈMES D'INFOS", X(AXE), Y(SOL) + wpx(26));
    var tot = state.entries.length;
    ctx.font = '400 ' + (f * 0.72).toFixed(1) + 'px "Syne",Helvetica,sans-serif';
    ctx.letterSpacing = "0.2em";
    ctx.fillStyle = "rgba(196,182,164,.7)";
    ctx.fillText(state.loading ? "CHARGEMENT"
      : state.year + "   ·   " + (tot ? tot + (tot > 1 ? " ACTUALITÉS" : " ACTUALITÉ")
                                      : "AUCUNE ACTUALITÉ"),
      X(AXE), Y(SOL) + wpx(26) + f * 1.8);
    ctx.letterSpacing = "0px";

    /* --- le cliché de l'actualité survolée --- */
    if(state.pip && vuePepin > 0.5){
      var hote = null, hp = null, ls = allLeaves();
      for(var hi = 0; hi < ls.length && !hp; hi++)
        for(var hj = 0; hj < ls[hi].pips.length; hj++)
          if(ls[hi].pips[hj].id === state.pip){ hote = ls[hi]; hp = ls[hi].pips[hj]; break; }
      var im = hp ? thumbFor(state.pip) : null;
      if(im){
        var px2 = X(hote.base.x + (hote.x - hote.base.x) * hp.u * 0.85);
        var py2 = Y(hote.base.y + (hote.y - hote.base.y) * hp.u * 0.85);
        var bw = Math.max(70, Math.min(132, W * 0.13));
        var bh = Math.min(bw * 1.35, Math.max(bw * 0.6,
                   bw * (im.naturalHeight / im.naturalWidth || 1)));
        var gap = dpx(9) + 10;
        var bx2 = px2 - bw / 2, by2 = py2 - gap - bh, dessous = false;
        if(by2 < 8){ by2 = py2 + gap; dessous = true; }
        bx2 = Math.max(8, Math.min(W - bw - 8, bx2));
        ctx.strokeStyle = hexa(BOIS.moyen, 0.5); ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(px2, py2 + (dessous ? gap * 0.4 : -gap * 0.4));
        ctx.lineTo(px2, dessous ? by2 : by2 + bh);
        ctx.stroke();
        ctx.save();
        ctx.shadowColor = "rgba(4,10,20,.85)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
        ctx.fillStyle = "#132840";
        ctx.fillRect(bx2, by2, bw, bh);
        ctx.restore();
        var sc = Math.max(bw / im.naturalWidth, bh / im.naturalHeight);
        var dw = im.naturalWidth * sc, dh = im.naturalHeight * sc;
        ctx.save();
        ctx.beginPath(); ctx.rect(bx2, by2, bw, bh); ctx.clip();
        ctx.drawImage(im, bx2 + (bw - dw) / 2, by2 + (bh - dh) / 2, dw, dh);
        ctx.restore();
        ctx.strokeStyle = hexa(BOIS.clair, 0.55); ctx.lineWidth = 1;
        ctx.strokeRect(bx2 + 0.5, by2 + 0.5, bw - 1, bh - 1);
      }
    }

    if(vuePepin < 0.05 && state.fruit === null){
      ctx.font = '400 ' + (f * 0.62).toFixed(1) + 'px "Syne",Helvetica,sans-serif';
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.letterSpacing = "0.18em";
      ctx.fillStyle = "rgba(196,182,164,.4)";
      ctx.fillText(vueFeuille < 0.5 ? "MOLETTE POUR APPROCHER LES FEUILLES"
                                    : "APPROCHEZ ENCORE POUR VOIR LES ACTUALITÉS",
                   W / 2, H - 16);
      ctx.letterSpacing = "0px";
    }
  }
  /* --------- les douze bouts de branches ---------
     Coordonnées dans fond.png, relevées au pixel : on isole le cuivre, on
     parcourt le bois depuis le pied en comptant les pas, et les extrémités sont
     les maxima locaux de cette distance.
     L'attribution des mois suit la capture annotée : on remonte le côté gauche
     depuis le bas, on traverse la cime, on redescend le côté droit. Trois
     pointes que ma règle d'écartement avait écartées à tort ont été rétablies
     (mars, juillet, octobre) ; trois branches intérieures ont été retirées.    */
  var IMG = { w:1672, h:941 };
  var FEUILLES = [
    { x: 536, y: 684 },   //  1 janvier   — bas gauche
    { x: 443, y: 497 },   //  2 février   — gauche
    { x: 537, y: 443 },   //  3 mars
    { x: 569, y: 326 },   //  4 avril
    { x: 639, y: 130 },   //  5 mai       — cime gauche
    { x: 848, y: 187 },   //  6 juin      — cime centre
    { x: 838, y: 261 },   //  7 juillet
    { x: 998, y: 162 },   //  8 août      — cime droite
    { x:1087, y: 288 },   //  9 septembre
    { x:1131, y: 445 },   // 10 octobre
    { x:1211, y: 548 },   // 11 novembre  — droite
    { x:1140, y: 695 }    // 12 décembre  — bas droite
  ];
  /* L'image est posée en « cover » : elle remplit le cadran en débordant du côté
     le plus étroit. On refait ici le même calcul que le navigateur, sans quoi
     les repères glisseraient par rapport au dessin. */
  /* La vue : une échelle et un décalage, qui glissent vers leur cible. Au repos
     l'image remplit le cadran ; en visant un mois, elle s'approche de sa
     branche. Comme le canevas dessine l'image ET les repères avec cette même
     vue, les deux ne peuvent pas se désaccorder. */
  var Z_BRANCHE = 3.5;                 // grossissement au clic
  var vue = { s:1, dx:0, dy:0, ts:1, tdx:0, tdy:0 };

  function cover(){                    // le cadrage au repos
    var s = Math.max(W / IMG.w, H / IMG.h);
    return { s: s, dx: (W - IMG.w * s) / 2, dy: (H - IMG.h * s) / 2 };
  }
  /* La veille ne prend la droite que lorsqu'elle est ouverte : fermée, ou en
     bandeau bas sous 1000 px, elle ne mange aucune largeur. */
  function veilleLarge(){
    var d = document.getElementById("veille-dock");
    return (d && !d.hidden && W > 1000) ? 372 : 0;
  }
  function libreX(){                   // le centre de ce que la veille laisse voir
    return (W - veilleLarge()) / 2;
  }
  function viseMois(i){
    var base = cover(), s = base.s * Z_BRANCHE, f = FEUILLES[i];
    vue.ts = s;
    vue.tdx = libreX() - f.x * s;
    vue.tdy = H / 2 - f.y * s;
  }
  function reposVue(){
    var b = cover();
    vue.ts = b.s; vue.tdx = b.dx; vue.tdy = b.dy;
  }
  function poseVue(){                  // sans transition : au chargement, au redimensionnement
    reposVue();
    vue.s = vue.ts; vue.dx = vue.tdx; vue.dy = vue.tdy;
  }
  function glisseVue(){
    vue.s += (vue.ts - vue.s) * 0.12;
    vue.dx += (vue.tdx - vue.dx) * 0.12;
    vue.dy += (vue.tdy - vue.dy) * 0.12;
  }
  /* L'image, chargée une fois puis dessinée à chaque image avec le même
     cadrage que les zones sensibles. */
  var fond = new Image();
  var fondPret = false;
  fond.onload = function(){ fondPret = true; if(!motion) draw(); };
  fond.src = "fond.png";
  /* Le repère suit la vue, jamais le cadrage de repos : sans quoi, dès qu'on
     s'approche d'une branche, les points restent en arrière et ne désignent
     plus rien. Juin et juillet n'étant séparés que de 75 px sur l'image, le
     rayon reste sous la moitié de cet écart. */
  function spot(i){
    var f = FEUILLES[i];
    return { x: vue.dx + f.x * vue.s, y: vue.dy + f.y * vue.s,
             r: Math.max(16, 26 * vue.s) };
  }

  function dessineParDessus(f, vueFeuille, vuePepin){
    // l'image et les repères partagent la même vue : ils ne peuvent pas dériver
    if(fondPret) ctx.drawImage(fond, vue.dx, vue.dy, IMG.w * vue.s, IMG.h * vue.s);
    /* De près, on ne montre que la branche visée : les onze autres repères
       flotteraient sur du bleu vide, hors de leur dessin. */
    var repos = cover().s;
    var proche = Math.max(0, Math.min(1, (vue.s / repos - 1.25) / 0.9));

    for(var i = 0; i < 12; i++){
      var s = spot(i), m = months[i], n = m ? m.n : 0;
      var vif = (state.focus === i) ? 1 : (state.hoverMonth === i ? 0.72 : 0);
      var vivant = n > 0;
      /* Tous les cercles s'effacent en s'approchant, y compris celui qu'on
         vient de cliquer : de près, on regarde la branche, pas le repère.
         Le bouton « Retour » prend le relais. */
      var voile = 1 - proche;
      if(voile < 0.02) continue;
      ctx.save();
      ctx.globalAlpha = voile;

      // un halo diffus, qui ne masque pas la feuille dessous
      if(vif > 0.02 || vivant){
        var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 1.5);
        var a = 0.1 + vif * 0.42 + (vivant ? 0.12 : 0);
        g.addColorStop(0, "rgba(240,224,196," + a.toFixed(3) + ")");
        g.addColorStop(1, "rgba(240,224,196,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.5, 0, 6.2832); ctx.fill();
      }
      // l'anneau : discret au repos, net quand on vise
      ctx.strokeStyle = "rgba(240,224,196," + (0.18 + vif * 0.7).toFixed(3) + ")";
      ctx.lineWidth = 1 + vif;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.82 + vif * 0.12), 0, 6.2832); ctx.stroke();

      if(vivant){                       // la pastille du nombre d'entrées
        ctx.fillStyle = "rgba(201,136,92," + (0.85 + vif * 0.15).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(s.x + s.r * 0.72, s.y - s.r * 0.72, s.r * 0.34, 0, 6.2832);
        ctx.fill();
        ctx.font = '700 ' + (s.r * 0.42).toFixed(1) + 'px "Syne",Helvetica,sans-serif';
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = "#14243c";
        ctx.fillText(String(n), s.x + s.r * 0.72, s.y - s.r * 0.7);
      }
      // le nom ne s'affiche qu'au survol : douze étiquettes en permanence
      // encombreraient le dessin qu'on cherche justement à laisser voir
      if(vif > 0.3){
        ctx.font = '700 ' + (f * 0.66).toFixed(1) + 'px "Syne",Helvetica,sans-serif';
        ctx.textAlign = "center"; ctx.textBaseline = "bottom";
        ctx.letterSpacing = "0.2em";
        ctx.shadowColor = "rgba(6,14,26,.95)"; ctx.shadowBlur = 10;
        ctx.fillStyle = "rgba(244,236,224," + vif.toFixed(2) + ")";
        ctx.fillText(MONTHS[i].toUpperCase(), s.x, s.y - s.r * 1.25);
        ctx.shadowBlur = 0;
        ctx.letterSpacing = "0px";
      }
      ctx.restore();
    }
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.font = '700 ' + (f * 1.12).toFixed(1) + 'px "Syne",Helvetica,sans-serif';
    ctx.letterSpacing = "0.26em";
    ctx.shadowColor = "rgba(6,14,26,.9)"; ctx.shadowBlur = 12;
    ctx.fillStyle = "rgba(240,232,220,.95)";
    ctx.fillText("LES SYSTÈMES D'INFOS", W / 2, H - f * 4.6);
    var tot = state.entries.length;
    ctx.font = '400 ' + (f * 0.72).toFixed(1) + 'px "Syne",Helvetica,sans-serif';
    ctx.letterSpacing = "0.2em";
    ctx.fillStyle = "rgba(201,168,133,.85)";
    ctx.fillText(state.loading ? "CHARGEMENT"
      : state.year + "   ·   " + (tot ? tot + (tot > 1 ? " ACTUALITÉS" : " ACTUALITÉ")
                                      : "AUCUNE ACTUALITÉ"),
      W / 2, H - f * 2.6);
    ctx.shadowBlur = 0;
    ctx.letterSpacing = "0px";
  }

  function frame(){ step(); draw(); requestAnimationFrame(frame); }

  /* ---------------- viser ---------------- */
  function toWorld(clientX, clientY){
    var r = cv.getBoundingClientRect();
    if(!r.width) return null;
    return {
      x: (clientX - r.left - r.width / 2) / (S * cam.k) + cam.x,
      y: (clientY - r.top - r.height / 2) / (S * cam.k) + cam.y
    };
  }
  /* Une feuille se vise sur son corps ; une actualité seulement quand elle est
     visible, le long du pétiole. À défaut, le bout du rameau cadre le mois. */
  /* Viser sur l'image : tout se joue en coordonnées d'écran, puisque le dessin
     y est posé au pixel. Pas de caméra, pas de conversion — la cible est là où
     on la voit. */
  function pickSurFond(clientX, clientY){
    var r = cv.getBoundingClientRect();
    if(!r.width) return null;
    var x = clientX - r.left, y = clientY - r.top;
    var best = null, bd = 1e9;
    for(var i = 0; i < 12; i++){
      var s = spot(i);
      var d = Math.hypot(x - s.x, y - s.y);
      if(d < s.r * 1.25 && d < bd){ bd = d; best = { kind:"month", month: months[i] }; }
    }
    return best;
  }

  function pick(clientX, clientY){
    if(!DESSINE_BOIS) return pickSurFond(clientX, clientY);
    var w = toWorld(clientX, clientY);
    if(!w) return null;
    var pepinsVisibles = cam.k >= K_PIP - 0.3;
    var best = null, bd = 1e9;
    var ls = allLeaves();
    for(var i = 0; i < ls.length; i++){
      var fe = ls[i];
      if(pepinsVisibles){
        for(var p = 0; p < fe.pips.length; p++){
          var pp = fe.pips[p];
          var qx = fe.base.x + (fe.x - fe.base.x) * pp.u * 0.85;
          var qy = fe.base.y + (fe.y - fe.base.y) * pp.u * 0.85;
          var dp = Math.hypot(w.x - qx, w.y - qy);
          if(dp < 14 && dp < bd){ bd = dp; best = { kind:"pip", fruit:fe, id:pp.id }; }
        }
      }
      // la feuille est un ovale : on vise son milieu avec une tolérance large
      var mx = fe.x + Math.cos(Math.atan2(fe.y - fe.base.y, fe.x - fe.base.x)) * fe.r * 0.45;
      var my = fe.y + Math.sin(Math.atan2(fe.y - fe.base.y, fe.x - fe.base.x)) * fe.r * 0.45;
      var d = Math.hypot(w.x - mx, w.y - my);
      if(d < fe.r * 0.7 && d < bd){ bd = d; best = { kind:"fruit", fruit:fe }; }
    }
    if(best) return best;
    for(var j = 0; j < 12; j++){
      var m = months[j];
      if(Math.hypot(w.x - m.x, w.y - m.y) < 46) return { kind:"month", month:m };
    }
    return null;
  }
  function look(cx, cy){
    var t = pick(cx, cy);
    var key = t && (t.kind === "fruit" || t.kind === "pip") ? t.fruit.key : null;
    var pip = t && t.kind === "pip" ? t.id : null;
    var mo = t ? (t.kind === "month" ? t.month.i : t.fruit.month) : null;
    if(key !== state.hover || pip !== state.pip || mo !== state.hoverMonth){
      state.hover = key; state.pip = pip; state.hoverMonth = mo;
      if(!motion) draw();
    }
    return t;
  }


  /* --------- les gestes --------- */
  /* L'image est fixe, cadrée toute seule : rien à tirer, rien à pincer. Le
     pointeur ne fait plus que désigner, et le canevas n'a donc aucun état de
     geste à tenir — pas de doigts à compter, donc pas de comptabilité qui
     survive à un relâchement hors du canevas et avale les clics suivants. */
  cv.addEventListener("pointerdown", function(ev){
    look(ev.clientX, ev.clientY);
  });
  cv.addEventListener("pointermove", function(ev){
    lastPt = { x:ev.clientX, y:ev.clientY };
    cv.style.cursor = look(ev.clientX, ev.clientY) ? "pointer" : "default";
  });
  cv.addEventListener("pointerleave", function(){
    lastPt = null; state.hover = null; state.pip = null; state.hoverMonth = null;
  });
  cv.addEventListener("wheel", function(ev){
    if(!DESSINE_BOIS) return;          // l image est fixe : rien à zoomer
    ev.preventDefault();
    var dy = ev.deltaY * (ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? 380 : 1);
    zoomAt(ev.clientX, ev.clientY, Math.exp(-dy * 0.0016));
  }, { passive:false });

  cv.addEventListener("click", function(ev){
    var t = pick(ev.clientX, ev.clientY);
    if(!t){ closeCard(); return; }
    if(t.kind === "pip"){ openEntry(t.id); return; }
    if(t.kind === "month"){ selectMonth(t.month.i); return; }
    // un fruit trop loin : on s'approche d'abord, on l'ouvre ensuite
    if(cam.k < K_LEAF) zoomTo(t.fruit);
    selectFruit(t.fruit);
  });
  cv.addEventListener("dblclick", function(){ recentre(); });

  cv.addEventListener("keydown", function(ev){
    var k = ev.key;
    lastPt = null;
    if(k === "ArrowRight" || k === "ArrowDown"){ ev.preventDefault(); stepMonth(1); }
    else if(k === "ArrowLeft" || k === "ArrowUp"){ ev.preventDefault(); stepMonth(-1); }
    else if(k === "Enter" || k === " "){ ev.preventDefault(); selectMonth(state.focus); }
    else if(k === "Escape"){ ev.preventDefault(); closeCard(); recentre(); }
  });

  /* --------- la fiche --------- */
  var cardEl = document.getElementById("detail");
  /* Le point d'accroche de la fiche : la pointe de branche du mois retenu, dans
     le repère de l'écran. (L'ancien calcul passait par le monde de l'arbre
     dessiné, qui n'existe plus depuis que le fond est une image.) */
  function anchor(){
    if(state.focus === null) return null;
    if(!DESSINE_BOIS) return spot(state.focus);
    if(state.fruit){
      var fr = allLeaves().filter(function(f){ return f.key === state.fruit; })[0];
      if(fr) return { x:X(fr.x), y:Y(fr.y), r:dpx(fr.r) };
    }
    if(months[state.focus])
      return { x:X(months[state.focus].x), y:Y(months[state.focus].y), r:dpx(20) };
    return null;
  }
  /* La fiche se pose vers l'EXTÉRIEUR de l'arbre, dans le vide, jamais au-dessus
     de la ramure. Posée simplement « à côté » de la pointe cliquée, elle
     recouvrait les pointes voisines : après avoir ouvert mai, juin et juillet
     devenaient inatteignables. */
  function placeCard(){
    if(cardEl.hidden) return;
    var a = anchor();
    if(!a) return;
    var pr = cv.getBoundingClientRect(), pl = cardEl.parentNode.getBoundingClientRect();
    var sx = a.x + (pr.left - pl.left), sy = a.y + (pr.top - pl.top);
    var w = cardEl.offsetWidth, h = cardEl.offsetHeight;

    // le pied du tronc, dans le même repère : il donne la direction du dehors
    var px = vue.dx + 836 * vue.s + (pr.left - pl.left);
    var py = vue.dy + 802 * vue.s + (pr.top - pl.top);
    var dx = sx - px, dy = sy - py, d = Math.hypot(dx, dy) || 1;
    var left = sx + (dx / d) * (a.r + 30) - (dx < 0 ? w : 0);
    var top  = sy + (dy / d) * (a.r + 20) - h / 2;

    // la colonne de veille occupe la droite quand elle est ouverte : on ne se
    // glisse pas dessous
    var limite = pl.width - (veilleLarge() || 10) - w;
    cardEl.style.left = Math.max(10, Math.min(limite, left)) + "px";
    cardEl.style.top = Math.max(10, Math.min(pl.height - h - 10, top)) + "px";
  }
  /* --------- le plus --------- */
  var plusEl = document.getElementById("plus");
  /* Il se pose au centre de la pointe retenue : le cercle du mois l'entoure,
     rien ne recouvre les pointes voisines. */
  function placePlus(){
    if(!plusEl || plusEl.hidden || state.focus === null) return;
    var a = anchor();
    if(!a) return;
    var pr = cv.getBoundingClientRect(), pl = plusEl.parentNode.getBoundingClientRect();
    var w = plusEl.offsetWidth, h = plusEl.offsetHeight;
    var left = a.x + (pr.left - pl.left) - w / 2;
    var top  = a.y + (pr.top - pl.top) - h / 2;
    plusEl.style.left = Math.max(6, Math.min(pl.width - w - 6, left)) + "px";
    plusEl.style.top  = Math.max(6, Math.min(pl.height - h - 6, top)) + "px";
  }
  /* Le mois reste « ouvert » tant que son plus est posé : c'est ce qui sépare
     un cadrage approché d'un retour au repos. */
  function moisOuvert(){
    return (plusEl && !plusEl.hidden) || (cardEl && !cardEl.hidden);
  }
  function openMonth(i){
    state.focus = i;
    plusEl.hidden = false;
    plusEl.setAttribute("aria-label", "Écrire une entrée de " + MONTHS[i].toLowerCase());
    plusEl.title = "Écrire";
    majRetour();
    renderReadout(); renderArrows(); placePlus();
    if(!motion) draw();
  }
  plusEl.addEventListener("click", function(){ openComposer(state.focus, null); });

  var retourEl = document.getElementById("retour");
  retourEl.addEventListener("click", function(){ closeCard(); });
  /* Le bouton n'existe que quand on est approché : au repos il n'aurait rien
     à ramener. */
  function majRetour(){
    retourEl.hidden = DESSINE_BOIS || state.focus === null;
  }

  function closeCard(){
    cardEl.hidden = true;
    plusEl.hidden = true;
    state.fruit = null; state.focus = null;
    if(!DESSINE_BOIS) reposVue();               // et on reprend du champ
    majRetour();
    renderReadout(); renderArrows();
    if(!motion) draw();
  }
  function fillCard(titre, sous, entries, monthIdx){
    document.getElementById("detailTitle").innerHTML =
      esc(titre) + ' <span>· ' + esc(sous) + "</span>";
    document.getElementById("detailList").innerHTML = entries.length
      ? entries.slice(0, 5).map(function(e, k){
          return '<li data-entry="' + e.id + '"><b>' + (k + 1) + '.</b> ' +
            (e.thumb ? '<img src="' + e.thumb + '" alt="">' : "") +
            '<span>' + esc(labelOf(e)) + '</span></li>';
        }).join("")
      : '<li class="none">Rien dans cette catégorie ce mois-ci.</li>';
    cardEl.hidden = false;
    state.focus = monthIdx;
    majRetour();
    renderReadout(); renderArrows(); placeCard();
    if(!motion) draw();
  }
  function selectFruit(fr){
    state.fruit = fr.key;
    fillCard(fr.cat.name.toUpperCase(),
             MONTHS[fr.month] + " · " + fr.entries.length +
               (fr.entries.length > 1 ? " actualités" : " actualité"),
             fr.entries, fr.month);
  }
  /* discret : on retient le mois sans ouvrir la fiche. Au chargement, une fiche
     surgie d'elle-même recouvrait la colonne de veille. */
  function selectMonth(i, discret){
    if(i === null || i === undefined) i = 0;
    i = ((i % 12) + 12) % 12;
    state.fruit = null;
    if(!discret && !DESSINE_BOIS) viseMois(i);   // on va voir la branche de près
    if(discret){
      state.focus = i;
      retourEl.hidden = true;        // rien à ramener : on n'a pas bougé
      renderReadout(); renderArrows();
      if(!motion) draw();
      return;
    }
    openMonth(i);
  }
  function stepMonth(d){ selectMonth((state.focus === null ? 0 : state.focus) + d); }

  cardEl.addEventListener("click", function(ev){
    if(ev.target.closest("#detailShut")){ closeCard(); return; }
    if(ev.target.closest("#detailWrite")){ openComposer(state.focus, null); return; }
    if(ev.target.closest("#detailAll")){
      document.getElementById("readout").scrollIntoView({
        behavior: motion ? "smooth" : "auto", block: "start" });
      return;
    }
    var li = ev.target.closest("[data-entry]");
    if(li) openEntry(li.getAttribute("data-entry"));
  });

  function renderSrNav(){
    document.getElementById("srnav").innerHTML = MONTHS.map(function(name, i){
      return '<button data-level="' + i + '">' + name + " (" + byMonth(i).length + ")</button>";
    }).join("");
  }
  document.getElementById("srnav").addEventListener("click", function(ev){
    lastPt = null;
    var b = ev.target.closest("[data-level]");
    if(b) selectMonth(parseInt(b.getAttribute("data-level"), 10));
  });

  /* ---------------- lecture ---------------- */
  function tagRow(e){
    var bits = [];
    if(e.country) bits.push('<span class="tag mood">' + esc(e.country) + '</span>');
    if(e.lang)    bits.push('<span class="tag">' + esc(e.lang) + '</span>');
    if(e.mood)    bits.push('<span class="tag mood">' + esc(e.mood) + '</span>');
    (e.tags || []).forEach(function(x){ bits.push('<span class="tag">' + esc(x) + '</span>'); });
    return bits.length ? '<div class="tags">' + bits.join("") + '</div>' : "";
  }

  // Une seule colonne, celle du mois qu'on regarde : le survol d'un point y
  // déplie l'entrée, sinon elle liste les dernières.
  function renderReadout(){
    var ro = document.getElementById("readout");
    if(state.focus === null){
      ro.innerHTML = '<p class="idle">' +
        (state.loading ? "Chargement" : "Choisissez un mois sur l'arbre") + '</p>';
      return;
    }
    var fx = state.focus, all = byMonth(fx), n = all.length;
    var prevM = (fx + 11) % 12, nextM = (fx + 1) % 12;
    var head = '<div class="rhead"><div class="rtitle">' +
      '<div class="rmonth">' + MONTHS[fx] + '</div>' +
      '<div class="rsub">' + (state.loading ? "Chargement"
        : (n ? n + (n > 1 ? " entrées" : " entrée") : "aucune entrée")) + '</div></div>' +
      '<button class="act lead" data-new="' + fx + '">Écrire</button></div>' +
      '<div class="rnav">' +
        '<button class="act" data-month="' + prevM + '">‹ ' + MONTHS[prevM] + '</button>' +
        '<button class="act" data-month="' + nextM + '">' + MONTHS[nextM] + ' ›</button>' +
      '</div>';

    if(!n){ ro.innerHTML = head + '<p class="rnone">Ce mois n\'a rien retenu.</p>'; return; }
    ro.innerHTML = head + '<ul class="rlist">' + all.slice(-PREVIEW).reverse().map(function(e, k){
      return '<li class="fade" style="animation-delay:' + (k * 32) + 'ms" data-entry="' + e.id + '">' +
        '<span class="day">' + dayStamp(e) + '</span>' +
        '<span class="ttl">' + esc(labelOf(e)) + '</span></li>';
    }).join("") + '</ul>' +
    (n > PREVIEW ? '<p class="rmore">+ ' + (n - PREVIEW) + " plus anciennes</p>" : "");
  }

  // Les chevrons des côtés : le seul chemin d'un mois à l'autre sur la carte.
  function renderArrows(){
    var f = state.focus === null ? 0 : state.focus;
    var p = (f + 11) % 12, n = (f + 1) % 12;
    var a = document.getElementById("prevM"), b = document.getElementById("nextM");
    a.setAttribute("aria-label", "Mois précédent : " + MONTHS[p]); a.title = MONTHS[p];
    b.setAttribute("aria-label", "Mois suivant : " + MONTHS[n]);   b.title = MONTHS[n];
  }
  document.getElementById("prevM").addEventListener("click", function(){ stepMonth(-1); });
  document.getElementById("nextM").addEventListener("click", function(){ stepMonth(1); });

  document.getElementById("readout").addEventListener("click", function(ev){
    var b = ev.target.closest("[data-month]");
    if(b){ selectMonth(parseInt(b.getAttribute("data-month"), 10)); return; }
    var nb = ev.target.closest("[data-new]");
    if(nb){ openComposer(parseInt(nb.getAttribute("data-new"), 10), null); return; }
    var li = ev.target.closest("[data-entry]");
    if(li) openEntry(li.getAttribute("data-entry"));
  });
  document.getElementById("readout").addEventListener("mouseover", function(ev){
    var li = ev.target.closest("[data-entry]");
    if(li) setHover(li.getAttribute("data-entry"));
  });

  /* ---------------- panneau ---------------- */
  var panel = document.getElementById("panel"),
      veil  = document.getElementById("veil"),
      pbody = document.getElementById("pbody"),
      pfoot = document.getElementById("pfoot"),
      lastFocus = null;

  function showPanel(){
    lastFocus = lastFocus || document.activeElement;
    panel.classList.add("on"); veil.classList.add("on");
    panel.setAttribute("aria-hidden","false");
    document.getElementById("shut").focus();
  }
  function closePanel(){
    panel.classList.remove("on"); veil.classList.remove("on");
    panel.setAttribute("aria-hidden","true");
    state.editing = null;
    var lf = lastFocus; lastFocus = null;
    if(lf && lf.focus) lf.focus();
  }
  function fullDate(iso){
    var d = new Date(iso + "T12:00:00");
    return pad(d.getDate()) + " " + SHORT[d.getMonth()] + " " + d.getFullYear();
  }

  function openEntry(id){
    var e = entryById(id);
    if(!e) return;
    state.editing = null;
    document.getElementById("pstamp").textContent = fullDate(e.date);
    // On n'ouvre que du http(s) : une entrée peut venir d'un import, et un lien
    // n'est pas forcément une adresse web sous prétexte qu'il est écrit là.
    var src = e.link && /^https?:\/\//i.test(e.link) ? e.link : "";
    pbody.innerHTML = '<article class="read">' +
      (e.title ? '<h3>' + esc(e.title) + '</h3>' : "") +
      (e.body ? '<p>' + esc(e.body) + '</p>' : "") +
      (src ? '<p class="src"><a href="' + esc(src) + '" target="_blank" rel="noopener noreferrer">' +
             esc(src.replace(/^https?:\/\//i, "").replace(/\/$/, "")) + '</a></p>' : "") +
      tagRow(e) +
      (e.thumb ? '<img id="shot" src="' + e.thumb + '" alt="" data-full="1">' : "") +
      '<button class="kill" data-del="' + e.id + '">Supprimer</button></article>';
    pfoot.innerHTML = '<button class="solid" data-edit="' + e.id + '">Modifier</button>';
    if(e.hasPhoto){
      store.get(imgKey(e.id)).then(function(full){
        var img = document.getElementById("shot");
        if(full && img) img.src = full;
      });
    }
    showPanel();
  }

  function openComposer(month, entry){
    var mi = entry ? monthOf(entry) : month;
    if(!(mi >= 0 && mi < 12)) mi = state.focus;      // à défaut, le mois qu'on regarde
    var isNew = !(entry && entry.id);                 // un brouillon n'a pas d'identifiant
    var def = entry ? entry.date
      : (today.getFullYear() === state.year && today.getMonth() === mi
          ? state.year + "-" + pad(mi + 1) + "-" + pad(today.getDate())
          : state.year + "-" + pad(mi + 1) + "-01");
    document.getElementById("pstamp").textContent =
      (isNew ? "Nouvelle entrée" : "Modifier") + " · " + MONTHS[mi].toLowerCase() + " " + state.year;
    pbody.innerHTML =
      '<div class="fld"><label for="f-date">Date</label>' +
        '<input type="date" id="f-date" value="' + def + '" min="' + state.year + '-01-01" max="' + state.year + '-12-31"></div>' +
      '<div class="fld"><label for="f-title">Titre</label>' +
        '<input type="text" id="f-title" value="' + esc(entry && entry.title || "") + '" placeholder="Le vent a tourné"></div>' +
      '<div class="fld"><label for="f-body">Texte</label>' +
        '<textarea id="f-body" placeholder="Ce qui s\'est passé, ce que j\'en retiens…">' + esc(entry && entry.body || "") + '</textarea></div>' +
      '<div class="fld"><label for="f-cat">Catégorie SI</label>' +
        '<div class="swatch" id="f-cats">' +
          CATS.map(function(c){
            var on = (entry ? catOf(entry) : "securite") === c.id;
            return '<button type="button" data-cat="' + c.id + '" aria-pressed="' +
                   (on ? "true" : "false") + '" style="--h:' + c.hue + '">' +
                   esc(c.name) + '</button>';
          }).join("") +
        '</div></div>' +
      '<div class="duo">' +
        '<div class="fld"><label for="f-country">Pays concerné</label>' +
          '<input type="text" id="f-country" value="' + esc(entry && entry.country || "") + '" placeholder="Sénégal"></div>' +
        '<div class="fld"><label for="f-lang">Langue de l\'article</label>' +
          '<input type="text" id="f-lang" list="f-langs" value="' + esc(entry && entry.lang || "") + '" placeholder="français">' +
          '<datalist id="f-langs">' +
            LANGS.map(function(l){ return '<option value="' + l + '">'; }).join("") +
          '</datalist></div>' +
      '</div>' +
      '<div class="fld"><label for="f-link">Lien — la source, fiable</label>' +
        '<input type="text" id="f-link" inputmode="url" value="' + esc(entry && entry.link || "") + '" placeholder="https://…"></div>' +
      '<div class="fld"><label for="f-photo">Photo</label><div class="shots">' +
        '<input type="file" id="f-photo" accept="image/*">' +
        (entry && entry.thumb ? '<img src="' + entry.thumb + '" alt=""><button class="act" id="dropPhoto">Retirer</button>' : "") +
        '</div></div>' +
      '<p class="alert" id="alert"></p>';
    pfoot.innerHTML = '<div class="pair"><button class="hollow" id="cancel">Annuler</button>' +
      '<button class="solid" id="save">Enregistrer</button></div>';
    state.editing = isNew ? null : entry.id;
    state.pendingPhoto = undefined;
    showPanel();
    var ta = document.getElementById("f-body");
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  }

  /* ---------------- photos ---------------- */
  function shrink(file, maxSide, quality){
    return new Promise(function(res, rej){
      var reader = new FileReader();
      reader.onerror = function(){ rej(new Error("read")); };
      reader.onload = function(){
        var im = new Image();
        im.onerror = function(){ rej(new Error("decode")); };
        im.onload = function(){
          var s = Math.min(1, maxSide / Math.max(im.width, im.height));
          var c2 = document.createElement("canvas");
          c2.width = Math.max(1, Math.round(im.width * s));
          c2.height = Math.max(1, Math.round(im.height * s));
          var k2 = c2.getContext("2d");
          k2.fillStyle = "#0A0C15"; k2.fillRect(0, 0, c2.width, c2.height);
          k2.drawImage(im, 0, 0, c2.width, c2.height);
          res(c2.toDataURL("image/jpeg", quality));
        };
        im.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ---------------- enregistrement ---------------- */
  function collect(){
    var date = document.getElementById("f-date").value;
    if(!date || date.slice(0,4) !== String(state.year)) return null;
    var chosen = document.querySelector("#f-cats button[aria-pressed=true]");
    var link = document.getElementById("f-link").value.trim();
    // le « https:// » est sous-entendu : on ne fait pas recopier ce qui se devine
    if(link && !/^[a-z][a-z0-9+.-]*:/i.test(link)) link = "https://" + link;
    return {
      date: date,
      title: document.getElementById("f-title").value.trim(),
      body: document.getElementById("f-body").value.trim(),
      cat: chosen ? chosen.getAttribute("data-cat") : "metier",
      country: document.getElementById("f-country").value.trim().slice(0, 80),
      lang: document.getElementById("f-lang").value.trim().slice(0, 40),
      link: link
    };
  }

  function saveEntry(){
    var msg = document.getElementById("alert");
    var f = collect();
    if(!f){ msg.textContent = "Choisissez une date de l'année " + state.year + "."; return; }
    if(f.link && !/^https?:\/\/[^\s\/]+\.[^\s]{2,}/i.test(f.link)){
      msg.textContent = "Ce lien n'a pas l'air d'une adresse web."; return;
    }
    var prior = state.editing ? entryById(state.editing) : null;
    var keepsPhoto = (state.pendingPhoto === undefined && prior && prior.hasPhoto) ||
                     (state.pendingPhoto && state.pendingPhoto.full);
    if(!f.body && !f.title && !keepsPhoto){
      msg.textContent = "Écrivez au moins une ligne, ou ajoutez une photo."; return;
    }
    var btn = document.getElementById("save");
    btn.disabled = true; btn.textContent = "Enregistrement";

    var entry = prior || { id: uid(), thumb: null, hasPhoto: false };
    var backup = prior ? JSON.parse(JSON.stringify(prior)) : null;
    entry.date = f.date; entry.title = f.title; entry.body = f.body;
    entry.country = f.country; entry.lang = f.lang; entry.link = f.link;
    entry.cat = f.cat;

    var chain = Promise.resolve();
    if(state.pendingPhoto === null){
      entry.thumb = null; entry.hasPhoto = false;
      chain = store.del(imgKey(entry.id));
    } else if(state.pendingPhoto){
      entry.thumb = state.pendingPhoto.thumb; entry.hasPhoto = true;
      chain = store.set(imgKey(entry.id), state.pendingPhoto.full);
    }
    if(state.pendingPhoto !== undefined) delete thumbs[entry.id];   // la vignette a changé
    chain.then(function(){
      if(!prior) state.entries.push(entry);
      return saveYear();
    }).then(function(r){
      if(!r.ok){
        if(prior && backup){ for(var k in backup) entry[k] = backup[k]; }
        else state.entries = state.entries.filter(function(x){ return x.id !== entry.id; });
        msg.textContent = r.msg;
        btn.disabled = false; btn.textContent = "Enregistrer";
        return;
      }
      build(); renderSrNav();
      selectMonth(monthOf(entry));
      closePanel();
    });
  }

  function removeEntry(id){
    var e = entryById(id);
    if(!e) return;
    if(!window.confirm("Supprimer cette entrée ? C'est définitif.")) return;
    var backup = state.entries.slice();
    state.entries = state.entries.filter(function(x){ return x.id !== id; });
    saveYear().then(function(r){
      if(!r.ok){
        state.entries = backup;
        setNote(r.msg, true);
        return;
      }
      if(e.hasPhoto) store.del(imgKey(id));
      delete thumbs[id];
      if(state.hover === id) state.hover = null;
      build(); renderSrNav(); renderReadout(); closePanel();
    });
  }

  var noteTimer = null;
  function setNote(msg, warn){
    var el = document.getElementById("note");
    el.textContent = msg || "";
    el.className = "note" + (warn ? " warn" : "");
    clearTimeout(noteTimer);
    if(msg && !warn) noteTimer = setTimeout(function(){ el.textContent = ""; }, 6000);
  }

  function exportJSON(){
    var data = {
      format: "journal-de-bord-v1", annee: state.year, exporte_le: new Date().toISOString(),
      entrees: state.entries.map(function(e){
        return { date: e.date, titre: e.title, texte: e.body, humeur: e.mood,
                 etiquettes: e.tags || [], photo: !!e.hasPhoto };
      }).sort(function(a,b){ return a.date < b.date ? -1 : 1; })
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "journal-de-bord-" + state.year + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    setNote("Texte exporté · photos conservées dans l'application");
  }

  /* ---------------- événements ---------------- */
  document.getElementById("prevY").addEventListener("click", function(){ state.year--; loadYear(); });
  document.getElementById("nextY").addEventListener("click", function(){ state.year++; loadYear(); });
  document.getElementById("exportBtn").addEventListener("click", exportJSON);
  document.getElementById("shut").addEventListener("click", closePanel);
  veil.addEventListener("click", closePanel);
  document.addEventListener("keydown", function(ev){
    if(ev.key !== "Escape") return;
    var lp = document.getElementById("loupe");
    if(lp.classList.contains("on")){ lp.classList.remove("on"); return; }
    if(panel.classList.contains("on")){ closePanel(); return; }
    // sinon Échap ramène l'arbre entier, même si le canevas n'a pas le focus
    if(state.focus !== null && !DESSINE_BOIS) closeCard();
  });

  pbody.addEventListener("click", function(ev){
    var tg = ev.target;
    var catBtn = tg.closest("[data-cat]");
    if(catBtn){
      Array.prototype.forEach.call(document.querySelectorAll("#f-cats button"),
        function(b){ b.setAttribute("aria-pressed", "false"); });
      catBtn.setAttribute("aria-pressed", "true");
      return;
    }
    if(tg.id === "dropPhoto"){
      state.pendingPhoto = null;
      if(tg.previousElementSibling) tg.previousElementSibling.remove();
      tg.remove(); return;
    }
    var dl = tg.closest("[data-del]");
    if(dl){ removeEntry(dl.getAttribute("data-del")); return; }
    var im = tg.closest("img[data-full]");
    if(im){
      var lp = document.getElementById("loupe");
      document.getElementById("loupeImg").src = im.src;
      lp.classList.add("on");
    }
  });

  pfoot.addEventListener("click", function(ev){
    var ed = ev.target.closest("[data-edit]");
    if(ed){ openComposer(null, entryById(ed.getAttribute("data-edit"))); return; }
    if(ev.target.id === "cancel"){
      if(state.editing) openEntry(state.editing); else closePanel();
      return;
    }
    if(ev.target.id === "save") saveEntry();
  });

  pbody.addEventListener("change", function(ev){
    if(ev.target.id !== "f-photo") return;
    var file = ev.target.files && ev.target.files[0];
    if(!file) return;
    document.getElementById("alert").textContent = "";
    Promise.all([ shrink(file, 1200, .72), shrink(file, 190, .5) ])
      .then(function(r){ state.pendingPhoto = { full:r[0], thumb:r[1] }; })
      .catch(function(){
        document.getElementById("alert").textContent =
          "Cette image n'a pas pu être lue. Essayez un JPEG ou un PNG.";
      });
  });

  document.getElementById("loupe").addEventListener("click", function(){ this.classList.remove("on"); });

  /* La colonne de veille s'ouvre et se ferme à la cloche : la place qu'elle
     prend à droite change, l'arbre approché doit se recentrer dans ce qui
     reste. Au repos il tient tout l'écran, rien à reprendre. */
  window.addEventListener("veille:dock", function(){
    if(state.focus !== null && moisOuvert()){ viseMois(state.focus); placeCard(); placePlus(); }
    if(!motion){ settle(); draw(); }
  });

  /* La cloche de veille est sur cette page : quand on verse une actualité au
     journal, inutile d'ouvrir un onglet — la fiche s'ouvre ici même. */
  window.__veilleJournalHost = true;
  window.addEventListener("veille:journal", function(ev){
    ev.preventDefault();
    var a = ev.detail || {};
    var draft = draftFromVeille({ t:a.title, u:a.url, s:a.summary, src:a.source,
      d:a.published_at || a.fetched_at, l:a.lang, conf:a.confirms,
      trust:a.trust_level });
    var an = parseInt(draft.date.slice(0, 4), 10);
    if(an && an !== state.year){
      state.year = an;
      loadYear().then(function(){ openComposer(monthOf(draft), draft); });
    } else openComposer(monthOf(draft), draft);
  });

  /* ---------------- venu de la veille ----------------
     Le widget de veille ouvre le journal avec l'actualité dans le fragment
     d'URL. On la décode et la fiche s'ouvre déjà remplie : il ne reste qu'à
     écrire ce qu'on en retient. Le fragment ne quitte jamais le navigateur —
     aucune requête, donc le journal marche même en fichier local.            */
  function unpack(s){
    try{
      var b64 = s.replace(/-/g, "+").replace(/_/g, "/");
      while(b64.length % 4) b64 += "=";
      var bin = atob(b64), bytes = new Uint8Array(bin.length);
      for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    }catch(e){ return null; }
  }
  function draftFromVeille(v){
    var d = new Date(v.d || Date.now());
    if(isNaN(d.getTime())) d = new Date();
    var iso = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    var corps = (v.s ? v.s + "\n\n" : "") +
      "— " + (v.src || "source") +
      (v.trust === "officiel" ? " · source officielle"
                              : (v.conf > 1 ? " · confirmé par " + v.conf + " sources" : ""));
    return {
      date: iso, title: v.t || "", body: corps, link: v.u || "",
      lang: v.l === "en" ? "anglais" : (v.l === "fr" ? "français" : (v.l || "")),
      country: "", tags: []
    };
  }
  function takeVeille(){
    var m = /(?:^|[#&])veille=([^&]+)/.exec(location.hash || "");
    if(!m) return null;
    var v = unpack(m[1]);
    // on nettoie l'adresse : un rechargement ne doit pas rouvrir la même fiche
    if(history.replaceState)
      history.replaceState(null, "", location.pathname + location.search);
    return v ? draftFromVeille(v) : null;
  }

  /* ---------------- démarrage ---------------- */
  window.addEventListener("resize", resize);
  build();
  resize();
  if(motion) requestAnimationFrame(frame); else { settle(); draw(); }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if(!motion) draw(); });

  var venu = takeVeille();
  if(venu){
    // l'actualité peut dater d'une autre année que celle affichée
    var an = parseInt(venu.date.slice(0, 4), 10);
    if(an && an !== state.year) state.year = an;
  }
  loadYear().then(function(){
    noteStockage();
    if(venu) openComposer(monthOf(venu), venu);
  });
})();
</script>

     de veille ; ouvert en fichier local, le widget reste muet sans gêner. -->
<script src="/widget.js" data-api="/api"
        data-mount="#veille" data-dock="#veille-dock"></script>
