# Déploiement Render — https://render.com
#
# Le service sert TOUT : l'API de veille, la cloche, et le journal de bord
# (route /journal). Une seule application, une seule origine, aucun CORS.
#
# ---- OFFRE GRATUITE (réglage actuel) ----
# Pas de disque : Render n'en propose qu'aux offres payantes. La base SQLite vit
# donc dans un système de fichiers éphémère et repart à zéro à chaque
# redémarrage. Conséquences, en clair :
#   · les articles sont recollectés en une passe (~30 s), rien n'est perdu ;
#   · les statuts « traité » le sont : la cloche réaffiche ses dix actualités.
# L'instance s'endort aussi après 15 min sans trafic — le planificateur interne
# s'arrête donc. Voir .github/workflows/veille.yml : une tâche planifiée GitHub
# la réveille et déclenche la collecte.
#
# ---- POUR PASSER EN PAYANT PLUS TARD ----
# 1. plan: starter
# 2. décommenter le bloc disk
# 3. décommenter VEILLE_DB
# Les statuts « traité » survivront alors aux déploiements.

services:
  - type: web
    name: veille-si
    runtime: node
    plan: free
    region: frankfurt
    rootDir: serveur
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/state
    autoDeploy: true

    # disk:
    #   name: veille-data
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "24"               # sur Node 22, node:sqlite exige un drapeau : voir package.json
      # - key: VEILLE_DB
      #   value: /var/data/veille.db
      - key: COLLECT_EVERY_MIN
        value: "30"
      - key: MAX_NOTIFS
        value: "10"
      - key: REFRESH_COOLDOWN_S
        value: "20"
      - key: VEILLE_TOKEN
        generateValue: true       # pour déclencher la collecte de l'extérieur
      - key: ALLOWED_ORIGINS
        value: ""
